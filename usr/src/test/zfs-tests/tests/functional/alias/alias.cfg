export TESTZONE=zfstest_alias
export ZONEROOT="/${TESTPOOL}/zones"
export ZONEPATH="${ZONEROOT}/${TESTZONE}"
export ZONEXML="/etc/zones/${TESTZONE}.xml"

# Scratch files used to drive and capture zonecfg(8)
export ALIAS_CMDFILE="${TEST_BASE_DIR%%/}/alias_zonecfg.cmd"
export ALIAS_OUTFILE="${TEST_BASE_DIR%%/}/alias_zonecfg.out"

# Delegated dataset names used by the zonecfg tests.  These need not exist.
export ALIAS_DS1="${TESTPOOL}/${TESTFS}/ds1"
export ALIAS_DS2="${TESTPOOL}/${TESTFS}/ds2"
export ALIAS_DS3="${TESTPOOL}/${TESTFS}/ds3"
