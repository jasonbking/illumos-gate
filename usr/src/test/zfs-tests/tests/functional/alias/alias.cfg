export TESTZONE=zfstest_alias
export ZONEROOT="/${TESTPOOL}/zones"
export ZONEPATH="${ZONEROOT}/${TESTZONE}"
export ZONEXML="/etc/zones/${TESTZONE}.xml"

# Scratch files used to drive and capture zonecfg(8)
export ALIAS_CMDFILE="${TEST_BASE_DIR%%/}/alias_zonecfg.cmd"
export ALIAS_OUTFILE="${TEST_BASE_DIR%%/}/alias_zonecfg.out"

# Delegated dataset names used by the zonecfg tests.  These need not exist.
export ALIAS_DS1="${TESTPOOL}/${TESTFS}/ds1"
export ALIAS_DS2="${TESTPOOL}/${TESTFS}/ds2"
export ALIAS_DS3="${TESTPOOL}/${TESTFS}/ds3"
export ALIAS_DS1_NESTED="${ALIAS_DS1}/nested"

#
# The boot tests need an installed zone.  Installing one is slow, so the
# first test that needs it installs $TESTZONE and later tests reuse it; the
# directory's cleanup script uninstalls it.  The brand and any extra
# 'zoneadm install' arguments can be chosen by setting ALIAS_ZONE_BRAND and
# ALIAS_ZONE_INSTALL_ARGS in the environment.  If neither is set, OmniOS
# uses the (small) sparse brand and other distributions use the brand from
# the default zone template.  If the zone cannot be installed, the boot
# tests report UNSUPPORTED.
#
if [[ -z $ALIAS_ZONE_BRAND ]] && grep -qs OmniOS /etc/release; then
	ALIAS_ZONE_BRAND=sparse
fi
export ALIAS_ZONE_BRAND
export ALIAS_ZONE_INSTALL_ARGS
export ALIAS_INSTALL_LOG="${TEST_BASE_DIR%%/}/alias_zone_install.log"
export ALIAS_BOOT_OUT="${TEST_BASE_DIR%%/}/alias_zone_boot.out"
# Seconds to wait for the zone to accept zlogin(1) after booting
export ALIAS_BOOT_TIMEOUT=300
